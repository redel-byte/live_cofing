[project]
name = "livecoding"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "El habib ridouane", email = "ridouanelhabib1@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fg-data-profiling>=4.20.0",
    "matplotlib>=3.8.0",
    "missingno>=0.5.2",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "plotly>=7.1.0",
    "scikit-learn>=1.4.0",
]

[project.scripts]
livecoding = "livecoding:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
